    // --- PROMPTPAY CRC16 & PAYLOAD GENERATOR ---
    function crc16(data) {
      let crc = 0xffff;
      for (let i = 0; i < data.length; i++) {
        let x = ((crc >> 8) ^ data.charCodeAt(i)) & 0xff;
        x ^= x >> 4;
        crc = ((crc << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xffff;
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function formatTag(id, value) {
      const len = value.length.toString().padStart(2, '0');
      return `${id}${len}${value}`;
    }

    function generatePromptPayPayload(target, amount = null) {
      if (!target) return '';
      const cleaned = target.replace(/[^0-9]/g, '');
      let formattedTarget = '';
      let targetTag = '01';

      if (cleaned.length === 10 && cleaned.startsWith('0')) {
        formattedTarget = `0066${cleaned.substring(1)}`;
        targetTag = '01';
      } else if (cleaned.length === 13) {
        formattedTarget = cleaned;
        targetTag = '02';
      } else {
        formattedTarget = cleaned.padStart(13, '0');
      }

      const aid = formatTag('00', 'A000000677010111');
      const targetFormatted = formatTag(targetTag, formattedTarget);
      const tag29 = formatTag('29', aid + targetFormatted);
      const tag00 = formatTag('00', '01');
      const tag01 = formatTag('01', amount && parseFloat(amount) > 0 ? '12' : '11');
      const tag53 = formatTag('53', '764');
      const tag58 = formatTag('58', 'TH');

      let raw = tag00 + tag01 + tag29 + tag53;
      if (amount && parseFloat(amount) > 0) {
        const formattedAmount = parseFloat(amount).toFixed(2);
        raw += formatTag('54', formattedAmount);
      }
      raw += tag58;

      const rawWithCrcTag = raw + '6304';
      const checksum = crc16(rawWithCrcTag);
      return rawWithCrcTag + checksum;
    }

    function formatCurrency(amount) {
      if (amount === undefined || amount === null || isNaN(amount)) return '0.00 ฿';
      return `${Number(amount).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ฿`;
    }

    function formatNumber(amount) {

      const thaiYear = parseInt(year, 10) + 543;
      return `${thaiMonthsFull[mIndex] || 'สิงหาคม'} ${thaiYear || 2569}`;

    // --- MAIN APP COMPONENT ---

          const saved = localStorage.getItem('mymonth_users');
          return saved ? JSON.parse(saved) : initialUsers;

      const [categories, setCategories] = useState(() => {

      const [expenses, setExpenses] = useState(() => {

      const [budgets, setBudgets] = useState(() => {

          return saved ? JSON.parse(saved) : initialBudgets;

      const [budgetHistories, setBudgetHistories] = useState(() => {
        try {
          const saved = localStorage.getItem('mymonth_histories');
          return saved ? JSON.parse(saved) : initialHistories;
        } catch (e) { return initialHistories; }
      });

      const [toast, setToast] = useState(null);
      const [addModalOpen, setAddModalOpen] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [adminUserModalOpen, setAdminUserModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [catFilter, setCatFilter] = useState('all');

      // Sync state to LocalStorage
      useEffect(() => { localStorage.setItem('mymonth_users', JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem('mymonth_current_user', JSON.stringify(currentUser)); }, [currentUser]);
      useEffect(() => { localStorage.setItem('mymonth_expenses', JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem('mymonth_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('mymonth_budgets', JSON.stringify(budgets)); }, [budgets]);
      useEffect(() => { localStorage.setItem('mymonth_histories', JSON.stringify(budgetHistories)); }, [budgetHistories]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Summary Calculations
      const filteredExpenses = expenses.filter(exp => {
        if (!exp.expense_date.startsWith(selectedMonth)) return false;
        if (typeFilter !== 'all' && exp.expense_type !== typeFilter) return false;
        if (catFilter !== 'all' && exp.category_id !== catFilter) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchTitle = exp.category_name.toLowerCase().includes(q);
          const matchNote = (exp.note || '').toLowerCase().includes(q);
          const matchTags = (exp.tags || []).some(t => t.toLowerCase().includes(q));
          if (!matchTitle && !matchNote && !matchTags) return false;
        }
        return true;
      });

      let totalPersonal = 0;
      let totalShared = 0;
      let myPersonalTotal = 0;

      expenses.filter(exp => exp.expense_date.startsWith(selectedMonth)).forEach(exp => {
        if (exp.expense_type === 'personal') {
          totalPersonal += exp.amount;
          if (exp.created_by === currentUser.id) myPersonalTotal += exp.amount;
        } else {
          totalShared += exp.amount;
        }
      });

      const totalAll = totalPersonal + totalShared;
      const personalPct = totalAll > 0 ? Math.round((totalPersonal / totalAll) * 100) : 0;
      const sharedPct = totalAll > 0 ? (100 - personalPct) : 0;

      // Settlement Calculations
      const userSummaries = users.map(m => {
        let paid = 0;
        let share = 0;
        expenses.filter(e => e.expense_type === 'shared' && e.expense_date.startsWith(selectedMonth)).forEach(exp => {
          if (exp.created_by === m.id) paid += exp.amount;
          const sp = (exp.splits || []).find(s => s.user_id === m.id);
          if (sp) share += sp.share_amount;
        });
        const net = Math.round((paid - share) * 100) / 100;
        return { user_id: m.id, user_name: m.full_name, promptpay_id: m.promptpay_id, paid_total: paid, share_total: share, net_balance: net };
      });

      const debts = [];
      const creditors = userSummaries.filter(u => u.net_balance > 0.01).map(u => ({ ...u, rem: u.net_balance }));
      const debtors = userSummaries.filter(u => u.net_balance < -0.01).map(u => ({ ...u, rem: Math.abs(u.net_balance) }));

      let cI = 0, dI = 0;
      while (cI < creditors.length && dI < debtors.length) {
        const cr = creditors[cI];
        const db = debtors[dI];
        const amt = Math.min(cr.rem, db.rem);
        if (amt > 0) {
          const rounded = Math.round(amt * 100) / 100;
          debts.push({
            from_user_name: db.user_name,
            to_user_name: cr.user_name,
            amount: rounded,
            promptpay_id: cr.promptpay_id,
            qr_payload: generatePromptPayPayload(cr.promptpay_id, rounded),
            note: `คืนค่าใช้จ่ายร่วม ${selectedMonth}`
          });
        }
        cr.rem -= amt;
        db.rem -= amt;
        if (cr.rem < 0.01) cI++;
        if (db.rem < 0.01) dI++;
      }

      // Budget Calculations
      let totalBudget = 0;
      const budgetItems = categories.map(cat => {
        const b = budgets.find(item => item.category_id === cat.id);

          actualSpent += e.amount;
        });
        const remaining = bAmt - actualSpent;
        const pctUsed = bAmt > 0 ? Math.round((actualSpent / bAmt) * 100) : 0;
        return { category_id: cat.id, category_name: cat.name, category_icon: cat.icon, budget_amount: bAmt, actual_spent: actualSpent, remaining, pctUsed };
      });

      const totalSpent = budgetItems.reduce((acc, b) => acc + b.actual_spent, 0);

      // Copy Bill as Image

            if (navigator.clipboard && window.ClipboardItem) {
              await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
              showToast('✅ คัดลอกบิลเป็นรูปภาพเรียบร้อย (วางใน LINE ได้ทันที)', 'success');

              a.download = `MyMonth-Bill-${selectedMonth}.png`;
              a.click();
              showToast('📥 ดาวน์โหลดรูปภาพบิลเรียบร้อยแล้ว', 'success');
            }
          });
        } catch (err) {
          showToast('ไม่สามารถคัดลอกรูปภาพได้: ' + err.message, 'error');

      };

      // Export Excel
      const handleExportExcel = () => {
        const rows = filteredExpenses.map(exp => ({
          'วันที่': exp.expense_date,
          'ประเภท': exp.expense_type === 'personal' ? 'ส่วนตัว' : 'ร่วม',

          'จำนวนเงิน': exp.amount,
          'ผู้จ่าย': exp.creator_name,
          'วิธีชำระ': exp.payment_method,
          'โน้ต': exp.note || '',

            {[

              onSave={(newExp) => {
                if (editingExpense) {

                  showToast('แก้ไขรายจ่ายสำเร็จ', 'success');
                } else {
                  setExpenses([{ ...newExp, id: `exp_${Date.now()}` }, ...expenses]);
                  showToast('บันทึกรายจ่ายใหม่สำเร็จ', 'success');

          {/* ADMIN USER MANAGEMENT MODAL */}

              users={users}
              currentUser={currentUser}
              onUpdateUsers={(updatedList) => {
                setUsers(updatedList);
                // Also update currentUser if it was modified
                const currentStillExists = updatedList.find(u => u.id === currentUser.id);
                if (currentStillExists) {
                  setCurrentUser(currentStillExists);
                } else if (updatedList.length > 0) {
                  setCurrentUser(updatedList[0]);

    // --- 🌟 ADD / EDIT EXPENSE MODAL WITH 2-WAY REACTIVE SYNC ---
    function AddExpenseModalView({ isOpen, onClose, categories, members, currentUser, selectedMonth, initialData, onSave }) {
      const [catId, setCatId] = useState(initialData?.category_id || categories[0]?.id || '');
      const [amount, setAmount] = useState(initialData?.amount ? initialData.amount.toString() : '1200');
      const [date, setDate] = useState(initialData?.expense_date || new Date().toISOString().substring(0, 10));
      const [type, setType] = useState(initialData?.expense_type || 'shared');
      const [payerId, setPayerId] = useState(initialData?.created_by || currentUser.id);
      const [note, setNote] = useState(initialData?.note || '');
      const [tags, setTags] = useState((initialData?.tags || []).join(', '));

      // 2-Way Reactive Smart Split States for Member 1 & Member 2
      const [m1Pct, setM1Pct] = useState(70);
      const [m1Amt, setM1Amt] = useState('840');
      const [m2Pct, setM2Pct] = useState(30);
      const [m2Amt, setM2Amt] = useState('360');

      const numAmount = parseFloat(amount) || 0;

      // Initialize from initialData if present
      useEffect(() => {
        if (initialData && initialData.splits && initialData.splits.length >= 2) {
          const s1 = initialData.splits[0];
          const s2 = initialData.splits[1];
          setM1Pct(s1.percentage);
          setM1Amt(s1.share_amount.toString());
          setM2Pct(s2.percentage);
          setM2Amt(s2.share_amount.toString());
        } else if (numAmount > 0) {
          // Default 50/50 or current ratio
          recalcFromM1Pct(m1Pct, numAmount);
        }
      }, [initialData]);

      // When Total Amount changes, keep % same and update amounts
      const handleTotalAmountChange = (newTotalStr) => {
        setAmount(newTotalStr);
        const newTotal = parseFloat(newTotalStr) || 0;
        if (newTotal > 0) {
          const a1 = Math.round(((newTotal * m1Pct) / 100) * 100) / 100;
          const a2 = Math.round((newTotal - a1) * 100) / 100;
          setM1Amt(a1.toString());
          setM2Amt(a2.toString());
        } else {
          setM1Amt('0');
          setM2Amt('0');
        }
      };

      // Helper: recalculate from Member 1 %
      const recalcFromM1Pct = (pctVal, total = numAmount) => {
        const p1 = Math.min(Math.max(parseFloat(pctVal) || 0, 0), 100);
        const p2 = Math.round((100 - p1) * 100) / 100;
        setM1Pct(p1);
        setM2Pct(p2);
        if (total > 0) {
          const a1 = Math.round(((total * p1) / 100) * 100) / 100;
          const a2 = Math.round((total - a1) * 100) / 100;
          setM1Amt(a1.toString());
          setM2Amt(a2.toString());
        }
      };

      // Helper: recalculate from Member 2 %
      const recalcFromM2Pct = (pctVal, total = numAmount) => {
        const p2 = Math.min(Math.max(parseFloat(pctVal) || 0, 0), 100);
        const p1 = Math.round((100 - p2) * 100) / 100;
        setM2Pct(p2);
        setM1Pct(p1);
        if (total > 0) {
          const a2 = Math.round(((total * p2) / 100) * 100) / 100;
          const a1 = Math.round((total - a2) * 100) / 100;
          setM2Amt(a2.toString());
          setM1Amt(a1.toString());
        }
      };

      // Helper: recalculate from Member 1 Amount
      const recalcFromM1Amt = (amtVal, total = numAmount) => {
        setM1Amt(amtVal);
        const a1 = Math.max(parseFloat(amtVal) || 0, 0);
        if (total > 0) {
          const a2 = Math.max(0, Math.round((total - a1) * 100) / 100);
          const p1 = Math.min(100, Math.round(((a1 / total) * 100) * 100) / 100);
          const p2 = Math.round((100 - p1) * 100) / 100;
          setM2Amt(a2.toString());
          setM1Pct(p1);
          setM2Pct(p2);
        }
      };

      // Helper: recalculate from Member 2 Amount
      const recalcFromM2Amt = (amtVal, total = numAmount) => {
        setM2Amt(amtVal);
        const a2 = Math.max(parseFloat(amtVal) || 0, 0);
        if (total > 0) {
          const a1 = Math.max(0, Math.round((total - a2) * 100) / 100);
          const p2 = Math.min(100, Math.round(((a2 / total) * 100) * 100) / 100);
          const p1 = Math.round((100 - p2) * 100) / 100;
          setM1Amt(a1.toString());
          setM2Pct(p2);
          setM1Pct(p1);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!numAmount || numAmount <= 0) return;
        const cat = categories.find(c => c.id === catId) || { name: 'อื่นๆ', icon: '➕' };
        const payer = members.find(m => m.id === payerId) || currentUser;

        let splits = [];
        if (type === 'shared' && members.length >= 2) {
          const a1 = parseFloat(m1Amt) || 0;
          const a2 = parseFloat(m2Amt) || Math.round((numAmount - a1) * 100) / 100;
          splits = [
            { user_id: members[0].id, user_name: members[0].full_name, percentage: m1Pct, share_amount: a1 },
            { user_id: members[1].id, user_name: members[1].full_name, percentage: m2Pct, share_amount: a2 }
          ];
        }

        onSave({
          category_id: catId,
          category_name: cat.name,
          category_icon: cat.icon,
          amount: numAmount,
          expense_date: date,
          payment_method: 'bank_transfer',
          expense_type: type,
          created_by: payerId,
          creator_name: payer.full_name,
          note,
          tags: tags.split(',').map(t => t.trim()).filter(Boolean),
          splits
        });
      };

      const m1 = members[0] || { full_name: 'ดิว' };
      const m2 = members[1] || { full_name: 'ป๊อบ' };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-lg w-full p-4 sm:p-6 shadow-2xl space-y-3 sm:space-y-3.5 my-4 sm:my-6">
            <div className="flex justify-between items-center pb-2.5 border-b border-slate-100">
              <h3 className="font-bold text-base">{initialData ? '✏️ แก้ไขรายจ่าย' : '➕ เพิ่มรายจ่ายใหม่'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block font-semibold mb-1">📂 หมวดหมู่ *</label>
                <select value={catId} onChange={(e) => setCatId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                  {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block font-semibold mb-1">💰 จำนวนเงินรวม (บาท) *</label>
                  <input
                    type="number"
                    step="0.5"
                    required
                    placeholder="1,200.00"
                    value={amount}
                    onChange={(e) => handleTotalAmountChange(e.target.value)}
                    className="w-full p-3 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-emerald-500 text-base"
                  />
                </div>
                <div>
                  <label className="block font-semibold mb-1">📅 วันที่ *</label>
                  <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-3 border border-slate-200 rounded-xl text-sm" />
                </div>
              </div>

              <div>
                <label className="block font-semibold mb-1">📌 ประเภทรายจ่าย *</label>
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => setType('personal')} className={`p-3 rounded-xl border text-left font-bold transition active:scale-95 ${type === 'personal' ? 'bg-blue-50 border-blue-500 text-blue-900' : 'border-slate-200'}`}>
                    ● รายจ่ายส่วนตัว (เฉพาะฉัน)
                  </button>
                  <button type="button" onClick={() => setType('shared')} className={`p-3 rounded-xl border text-left font-bold transition active:scale-95 ${type === 'shared' ? 'bg-emerald-50 border-emerald-500 text-emerald-900' : 'border-slate-200'}`}>
                    ● รายจ่ายร่วม (แชร์ห้อง)
                  </button>
                </div>
              </div>

              <div>
                <label className="block font-semibold mb-1">👤 ผู้จ่ายเงิน</label>
                <select value={payerId} onChange={(e) => setPayerId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium">
                  {members.map(m => <option key={m.id} value={m.id}>{m.full_name}</option>)}
                </select>
              </div>

              {/* 🌟 2-WAY SMART SPLIT (Auto Hidden when personal) */}
              {type === 'shared' && members.length >= 2 && (
                <div className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                  <div className="flex justify-between items-center font-bold text-xs text-slate-800">
                    <span>🔀 Smart Split (ปรับ % หรือ เงิน สัมพันธ์กันอัตโนมัติ)</span>
                    <span className="text-[11px] text-slate-500 font-normal">ยอดรวม: <strong>{formatNumber(numAmount)} ฿</strong></span>
                  </div>

                  {/* Preset quick buttons */}
                  <div className="flex flex-wrap items-center gap-1">
                    <span className="text-[11px] text-slate-400 mr-1">ปุ่มลัด:</span>
                    {[
                      { l: '50/50', p: 50 },
                      { l: '60/40', p: 60 },
                      { l: '70/30', p: 70 },
                      { l: '80/20', p: 80 },
                      { l: '90/10', p: 90 },
                      { l: '100/0', p: 100 }
                    ].map(r => (
                      <button
                        key={r.l}
                        type="button"
                        onClick={() => recalcFromM1Pct(r.p)}
                        className={`px-2 py-0.5 rounded-lg border text-[10px] font-bold transition ${
                          m1Pct === r.p ? 'bg-emerald-600 text-white border-emerald-600 shadow-2xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                        }`}
                      >
                        {r.l}
                      </button>
                    ))}
                  </div>

                  {/* Member 1 Row (ดิว) */}
                  <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-800">👤 {m1.full_name}</span>
                      <div className="flex items-center gap-2">
                        {/* % Input */}
                        <div className="flex items-center gap-0.5 border border-slate-200 rounded-lg px-2 py-0.5 focus-within:border-emerald-500">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            value={m1Pct}
                            onChange={(e) => recalcFromM1Pct(e.target.value)}
                            className="w-12 text-right font-bold text-slate-800 focus:outline-none bg-transparent"
                          />
                          <span className="text-[10px] text-slate-400 font-semibold">%</span>
                        </div>
                        <span className="text-slate-300">↔</span>
                        {/* Amount Input */}
                        <div className="flex items-center gap-0.5 border border-emerald-300 bg-emerald-50/70 rounded-lg px-2 py-0.5 focus-within:border-emerald-500">
                          <input
                            type="number"
                            min="0"
                            step="0.5"
                            value={m1Amt}
                            onChange={(e) => recalcFromM1Amt(e.target.value)}
                            className="w-18 text-right font-extrabold text-emerald-800 focus:outline-none bg-transparent"
                          />
                          <span className="text-[10px] text-emerald-600 font-bold">฿</span>
                        </div>
                      </div>
                    </div>
                    {/* Slider for Member 1 */}
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={m1Pct}
                      onChange={(e) => recalcFromM1Pct(e.target.value)}
                      className="w-full h-2 bg-slate-200 rounded-lg accent-emerald-600 cursor-pointer"
                    />
                  </div>

                  {/* Member 2 Row (ป๊อบ) */}
                  <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-800">👤 {m2.full_name}</span>
                      <div className="flex items-center gap-2">
                        {/* % Input */}
                        <div className="flex items-center gap-0.5 border border-slate-200 rounded-lg px-2 py-0.5 focus-within:border-emerald-500">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            value={m2Pct}
                            onChange={(e) => recalcFromM2Pct(e.target.value)}
                            className="w-12 text-right font-bold text-slate-800 focus:outline-none bg-transparent"
                          />
                          <span className="text-[10px] text-slate-400 font-semibold">%</span>
                        </div>
                        <span className="text-slate-300">↔</span>
                        {/* Amount Input */}
                        <div className="flex items-center gap-0.5 border border-emerald-300 bg-emerald-50/70 rounded-lg px-2 py-0.5 focus-within:border-emerald-500">
                          <input
                            type="number"
                            min="0"
                            step="0.5"
                            value={m2Amt}
                            onChange={(e) => recalcFromM2Amt(e.target.value)}
                            className="w-18 text-right font-extrabold text-emerald-800 focus:outline-none bg-transparent"
                          />
                          <span className="text-[10px] text-emerald-600 font-bold">฿</span>
                        </div>
                      </div>
                    </div>
                    {/* Slider for Member 2 */}
                    <input
                      type="range"
                      min="0"
                      max="100"
                      value={m2Pct}
                      onChange={(e) => recalcFromM2Pct(e.target.value)}
                      className="w-full h-2 bg-slate-200 rounded-lg accent-emerald-600 cursor-pointer"
                    />
                  </div>


                </div>
              )}

              <div>
                <label className="block font-semibold mb-1">📝 โน้ต / หมายเหตุ</label>
                <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="เช่น เลขมิเตอร์ 1234" className="w-full p-2.5 border border-slate-200 rounded-xl" />
              </div>

              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button type="button" onClick={onClose} className="flex-1 py-3 border border-slate-200 rounded-xl font-semibold text-slate-600 active:scale-95">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md active:scale-95">บันทึก</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- 👑 ADMIN USER MANAGEMENT MODAL (100% Client/Offline Robust) ---
    function AdminUserModalView({ isOpen, onClose, users, currentUser, onUpdateUsers }) {
      const [mode, setMode] = useState('list'); // 'list' | 'add' | 'edit'
      const [editingId, setEditingId] = useState(null);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('Member');
      const [promptpay, setPromptpay] = useState('');

      const goToList = () => {
        setMode('list');
        setEditingId(null);
        setName('');
        setEmail('');
        setRole('Member');
        setPromptpay('');
      };

      const handleStartAdd = () => {
        setMode('add');
        setEditingId(null);
        setName('');
        setEmail('');
        setRole('Member');
        setPromptpay('');
      };

      const handleStartEdit = (u) => {
        setMode('edit');
        setEditingId(u.id);
        setName(u.full_name || '');
        setEmail(u.email || '');
        setRole(u.role || 'Member');
        setPromptpay(u.promptpay_id || '');
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          alert('กรุณาระบุชื่อสมาชิก');
          return;
        }

        let updatedList;

        if (mode === 'add') {
          // สร้าง Avatar จาก initial ตัวอักษร (inline SVG ไม่ต้องใช้ API ภายนอก)
          const colors = ['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'];
          const color = colors[(users.length) % colors.length];
          const initial = name.trim().charAt(0).toUpperCase();
          const svgAvatar = `data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' rx='12' fill='${encodeURIComponent(color)}'/><text x='30' y='39' font-size='26' text-anchor='middle' font-family='sans-serif' fill='white' font-weight='bold'>${encodeURIComponent(initial)}</text></svg>`;

          const newUser = {
            id: `user_${Date.now()}`,
            full_name: name.trim(),
            email: email.trim() || `user_${Date.now()}@mymonth.app`,
            role,
            room_code: currentUser.room_code || 'ROOM2026',
            promptpay_id: promptpay.trim(),
            avatar_url: svgAvatar
          };
          updatedList = [...users, newUser];

        } else if (mode === 'edit' && editingId) {
          updatedList = users.map(u => u.id === editingId
            ? { ...u, full_name: name.trim(), email: email.trim() || u.email, role, promptpay_id: promptpay.trim() }
            : u
          );
        } else {
          return;
        }

        onUpdateUsers(updatedList);
        goToList();
      };

      const handleDelete = (targetId) => {
        if (targetId === currentUser.id) {
          alert('ไม่สามารถลบบัญชีของตัวเองได้');
          return;
        }
        const targetUser = users.find(u => u.id === targetId);
        if (window.confirm(`ต้องการลบ "${targetUser?.full_name || 'สมาชิก'}" ออกจากห้องหรือไม่?`)) {
          onUpdateUsers(users.filter(u => u.id !== targetId));
        }
      };

      // Avatar display component (inline, no external API needed)
      const UserAvatar = ({ user }) => {
        const colors = ['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
        const initials = (user.full_name || '?').charAt(0).toUpperCase();
        const colorIndex = user.full_name?.charCodeAt(0) % colors.length || 0;
        const bgColor = colors[colorIndex];
        
        // Try image first; fall back to initials
        if (user.avatar_url && !user.avatar_url.includes('unsplash') === false) {
          return (
            <div className="w-9 h-9 rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center flex-shrink-0">
              <img
                src={user.avatar_url}
                className="w-9 h-9 object-cover"
                onError={(e) => {
                  e.target.replaceWith(
                    Object.assign(document.createElement('div'), {
                      className: 'w-9 h-9 rounded-xl flex items-center justify-center text-white text-base font-bold',
                      style: `background:${bgColor}`,
                      textContent: initials
                    })
                  );
                }}
              />
            </div>
          );
        }
        return (
          <div
            className="w-9 h-9 rounded-xl flex items-center justify-center text-white text-base font-bold flex-shrink-0"
            style={{ background: bgColor }}
          >
            {initials}
          </div>
        );
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl my-6">

            {/* Header */}
            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100">
              <div>
                <h3 className="font-bold text-slate-900 text-sm flex items-center gap-2">
                  {mode === 'list' ? '👑 จัดการสมาชิกในห้อง' : mode === 'add' ? '➕ เพิ่มสมาชิกใหม่' : '✏️ แก้ไขข้อมูลสมาชิก'}
                </h3>
                <p className="text-[10px] text-slate-400 mt-0.5">
                  {mode === 'list' ? `สมาชิกทั้งหมด ${users.length} คน` : 'กรอกข้อมูลด้านล่าง แล้วกดบันทึก'}
                </p>
              </div>
              <button onClick={mode === 'list' ? onClose : goToList} className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1 leading-none">
                {mode === 'list' ? '✕' : '←'}
              </button>
            </div>

            {/* ─── LIST MODE ─── */}
            {mode === 'list' && (
              <div className="px-5 py-4 space-y-3">
                <div className="flex justify-end">
                  <button
                    onClick={handleStartAdd}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-sm transition"
                  >
                    ➕ เพิ่มสมาชิก
                  </button>
                </div>

                <div className="border border-slate-100 rounded-2xl overflow-hidden divide-y divide-slate-100">
                  {users.map((u) => (
                    <div key={u.id} className="flex items-center justify-between px-3 py-2.5 hover:bg-slate-50 transition">
                      <div className="flex items-center gap-2.5">
                        <UserAvatar user={u} />
                        <div>
                          <div className="font-bold text-slate-800 flex items-center gap-1.5">
                            <span>{u.full_name}</span>
                            {u.id === currentUser.id && <span className="text-[10px] text-emerald-600 font-semibold">(ฉัน)</span>}
                            <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold ${
                              u.role === 'Admin' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'
                            }`}>
                              {u.role}
                            </span>
                          </div>
                          <span className="text-[10px] text-slate-400">{u.email} {u.promptpay_id && `• ${u.promptpay_id}`}</span>
                        </div>
                      </div>
                      <div className="flex gap-1">
                        <button
                          onClick={() => handleStartEdit(u)}
                          className="p-1.5 text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition"
                          title="แก้ไขข้อมูล"
                        >
                          ✏️
                        </button>
                        {u.id !== currentUser.id && (
                          <button
                            onClick={() => handleDelete(u.id)}
                            className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                            title="ลบสมาชิกออกจากห้อง"
                          >
                            🗑️
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              <div className="flex justify-end pt-2">
                  <button onClick={onClose} className="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">ปิด</button>
                </div>
              </div>
            )}

            {/* ─── ADD / EDIT FORM MODE ─── */}
            {(mode === 'add' || mode === 'edit') && (
              <form onSubmit={handleSave} className="px-5 py-4 space-y-3 text-xs">
                <div>
                  <label className="block font-semibold mb-1.5 text-slate-700">ชื่อ / ชื่อเล่น *</label>
                  <input
                    type="text"
                    required
                    autoFocus
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="เช่น ดิว, สมชาย"
                    className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div>
                  <label className="block font-semibold mb-1.5 text-slate-700">อีเมล</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="user@mymonth.app"
                    className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-semibold mb-1.5 text-slate-700">บทบาท *</label>
                    <select
                      value={role}
                      onChange={(e) => setRole(e.target.value)}
                      className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none bg-white font-bold"
                    >
                      <option value="Member">👤 Member</option>
                      <option value="Admin">👑 Admin</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold mb-1.5 text-slate-700">พร้อมเพย์ ID</label>
                    <input
                      type="text"
                      value={promptpay}
                      onChange={(e) => setPromptpay(e.target.value)}
                      placeholder="0812345678"
                      className="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none font-mono"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-3 border-t border-slate-100">
                  <button type="button" onClick={goToList} className="flex-1 py-2.5 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 transition">
                    ยกเลิก
                  </button>
                  <button type="submit" className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md transition">
                    💾 บันทึก
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
