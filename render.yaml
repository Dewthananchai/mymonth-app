services:
  - type: web
    name: mymonth
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd .. && npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_MESSAGING_CHANNEL_ID
        sync: false
      - key: LINE_MESSAGING_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_FRONTEND_URL
        sync: false
