services:
  - type: web
    name: mymonth
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix admin-web install --include=dev && npm --prefix admin-web run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_MESSAGING_CHANNEL_ID
        sync: false
      - key: LINE_MESSAGING_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_FRONTEND_URL
        sync: false
